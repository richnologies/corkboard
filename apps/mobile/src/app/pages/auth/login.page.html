<ion-content class="auth-shell">
  <div class="auth-card">
    <h1 class="brand-title">{{ 'app.name' | translate }}</h1>
    <p class="subtitle">{{ 'app.tagline' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list lines="none">
        <ion-item>
          <ion-input
            [label]="'auth.email' | translate"
            labelPlacement="stacked"
            type="email"
            formControlName="email"
            autocomplete="email"
          />
        </ion-item>
        <ion-item>
          <ion-input
            [label]="'auth.password' | translate"
            labelPlacement="stacked"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </ion-item>
      </ion-list>

      @if (error()) {
        <ion-text color="danger"><p class="error">{{ error() }}</p></ion-text>
      }

      <ion-button expand="block" type="submit" [disabled]="loading()">
        @if (loading()) {
          <ion-spinner name="crescent" />
        } @else {
          {{ 'auth.signIn' | translate }}
        }
      </ion-button>
    </form>

    <p class="footer-link">
      {{ 'auth.newHere' | translate }}
      <a routerLink="/register">{{ 'auth.createAccount' | translate }}</a>
    </p>
  </div>
</ion-content>
